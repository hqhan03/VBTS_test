created: '2026-09-01'
design:
  principles:
  - 9DTact
  - DIGIT
  - DIGIT_Marker
  hardness:
  - soft
  - medium
  - hard
  thickness_mm:
  - 1
  - 2
  - 3
  replicates: 2
  total: 54
  scheme: 'full factorial 3x3x3 with n=2. Replicates are deliberately NOT run back
    to back: set 1 covers all 27 conditions, set 2 follows later, so replicate variance
    carries mounting, temperature and day-to-day drift rather than five minutes of
    the same session'
force_policy:
  mode: per-sensor ceiling with a common lower range
  target_ladder_N:
