known_hardware_faults:
- path: SCB-68A terminals 60 (+) / 26 (-)
  daq_channel: Dev1/ai5
  status: UNUSABLE — do not assign a gauge
  evidence: 'Continuity from IFPS pin 4/13 to the terminals is good and a meter reads
    the signal there (1.348 V unloaded, -8 mV under 1.004 kg), but it never reaches
    the DAQ. Dev1/ai5 reads as an open input: 99.98% of whatever the multiplexer sampled
    before it. The break is downstream of the screw terminal, inside the SCB-68A or
    the 68-pin cable.'
- path: SCB-68A AI6 pair (AI6+ / AI14-)
  daq_channel: Dev1/ai6
  status: DEGRADED — do not assign a gauge
  evidence: Carries a signal, but couples about 2.1% of the preceding channel into
    it, against 0.01-0.02% on every healthy input. Re-seating the terminal did not
    help, and slowing the convert clock from 12 us to 200 us per channel did not help,
    so it is neither a loose screw nor a settling limitation. Moving the same SG5
    lead to the AI7 pair dropped the coupling to 0.01%, which proves the fault belongs
    to the AI6 terminal pair and not to the SG5 signal path. Mechanism not established.
