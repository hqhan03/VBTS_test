sg0_reference_correction: SG0 reference is terminal 34 (AI0-), not 35 (AI GND). With
  the reference on 35 the AI0 differential negative was floating, which is what the
  earlier 'ai0 open circuit' diagnosis detected. With terminal 34, Dev1/ai0 reads
  1.179 V DIFF at std 0.756 mV, matching the meter's 1.175 V, and responds -56.6 mV
  to the load.
scale_resolved: '|Fz| error is now +0.02% (-9.848 N vs -9.846 N expected). The +18%
  / -23% errors seen in Tasks 5-8 were artifacts of the broken SG0 reference, not
  a gain problem.'
order_not_uniquely_determined: 58 of 720 permutations reproduce |Fz| within 1%, so
  a single vertical load cannot fix the order among the six. The SCB-68A labels remain
  the authority for order; this measurement confirms the channel SET and the Fz scale.
residual_lateral_is_physical: ~3.0 N lateral appears in essentially every permutation
  that gets Fz right, so it is a property of the load, not of the mapping. Total force
  10.30 N tilted 17.1 deg from vertical, with an implied application height of 21.8
  mm.
config_not_modified: 'ft_config.yaml still lists the connector-1 channels ai16..ai21
  and is now STALE, since the SCB-68A is back on connector 0. Not changed: this task
  forbids it.'
