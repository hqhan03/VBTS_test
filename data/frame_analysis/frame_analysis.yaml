recommended_procedure:
- step: TCP calibration of the indenter
  detail: The robot needs a known point before it can be used to probe anything. Use
    the FR5's 4-point method (SetTcp4RefPoint / ComputeTcp4) on the steel-ball indenter.
    Until this exists there is no robot-side reference.
- step: Establish R by axis-aligned probing
  detail: With the sensor tared, press the indenter onto the VBTS along the robot
    base +X, then +Y, then +Z, one at a time. Each push gives a force direction in
    the sensor frame for a known direction in the base frame; three of them determine
    R. Orthonormalise the result and report the residual, which is the honest error
    bar.
- step: Establish t by touching known points
  detail: Move the TCP to several points on the sensor or its holder whose position
    is known in the sensor frame, and read the TCP pose in the base frame. Alternatively
    measure the mount geometry directly, remembering the 6.858 mm BasicTransform offset.
- step: Verify with a load the transform did not see
  detail: Apply a push along a direction not used to fit R and check that the transformed
    force points where the robot thinks it pushed. Fitting three directions and testing
    on a fourth is what separates a real calibration from a tautology.
