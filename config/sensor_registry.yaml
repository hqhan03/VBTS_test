  tolerance_N: 0.03
capture_policy:
  mode: continuous capture with an equal frame budget per sensor
  frames_per_sensor: 1000
  normal_fraction: 0.5
  ramp_step_N: 0.1
  ramp_settle_s: 0.15
  anchor_every_N: 0.1
  timing_reverted_2026-09-07: 'the 0.05 s / 0.5 N trial on 9DTact_medium_3mm_r1 did
    not shorten collect: 726 s against 678-723 s on the two units before it. Load
    steps did get faster (1.03 -> 0.41 s) but the run needed 10+12 cycles instead
    of 7-8 + 9-10, because the frames that fill the force bins are the ones captured
    while the probe pauses at a rung; shorten the pause and each pass contributes
    fewer distinct-force frames, so more passes are needed. Time per saved frame stayed
    at 0.7 s. Reverted so all 17 units share one pacing; only medium_3mm_r1 was collected
    at 0.05 s / 0.5 N (its labels and bins are unaffected, its per-cycle yield is
    lower)'
  timing_basis_2026-09-07: 'measured on the first ten Pass B units (13-17 min each,
    collect 82 %): the LOAD steps ran 1.03 s against 0.42 s for the same move on UNLOAD,
    and the difference was the anchor sample taken at every 0.1 N rung -- wait for
    a fresh frame, write a PNG, write state -- 316-350 per run, about 80 s. Anchors
    are auxiliary settled samples for the Hertz fit and the rung tables, not part
    of the frame budget; 0.5 N spacing still gives about 28 per run. The ramp settle
    was cut 0.15 -> 0.05 s for the same reason: each frame is labelled with the F/T
    mean over its own exposure window, so the settle only pads the pause between steps.
    Neither change touches the 1000 saved frames, the bins, the separation rule or
    the range. Applied from 9DTact_medium_3mm_r1 on; the ten units before it were
    collected at 0.15 s / 0.1 N'
  rationale: the sensors are compared on how well a force estimator trains on each,
    so every run saves exactly the same number of frames. Loading/unloading cycles
    to the sensor's own ceiling repeat until the budget is spent, so a stiff 3 mm
    gel and a soft 1 mm one give the same count; the 1 mm one simply sees more cycles.
    Frames are saved at the camera rate during every commanded motion and labelled
    with the F/T mean over the frame's own exposure window and the interpolated TCP
    pose
  speed_pct:
    contact: 40
    free: 60
    basis: 'raised 2026-09-05. The 15 % contact limit came from a 0.05 mm step at
      30 % reading back 0.111 mm, but that was read BEFORE it settled. Re-measured
      with the settle actually used, eight 0.05 mm steps at 15/25/40/60 % landed to
      sigma 0.0161/0.0091/0.0033/0.0054 mm -- no fall-off with speed, best at 40.
      Speed buys little time either: 0.60 s per step at 15 % against 0.57 s at 60
      %, because the step is settle and RPC, not motion'
  frames_basis: 'set 2026-09-04 from a 9DTact-method force-estimation study on 9DTact_soft_1mm_r2:
    a ResNet-18 trained their way reaches 0.072 N normal-force MAE (1.5% of range,
    R2 0.992) on temporally held-out cycles from 800 frames, and 2424 frames scored
    the same within seed noise. Below 4 N the error halves with data; above 4 N it
    does not improve at all, because the image response is saturating there and only
    8% of frames sit in that band'
  ramp_mode_basis: 'continuous since 2026-09-07 (12th unit on, 9DTact_hard_1mm_r1):
    the probe glides instead of stepping, and the glide is PACED -- each segment aims
    at 0.25 N and 1.7 s (0.15 N/s), its length and velocity computed from the stiffness
    measured on the segment before, and the arm''s mm/s at 100 % learned from each
    glide''s own elapsed time. The pace is what matters: a frame is kept only if its
    force differs by --min-sep (0.02 N) from one already in its bin, and frames arrive
    every 0.206 s, so the force must move about 0.1 N/s. A first attempt at a fixed
    0.5 % gave 0.035 N/s and the same 31 % acceptance the stepped ramp had. The shear
    RETURN is not paced -- it retraces forces already covered, and pacing it cost
    426 s of a 788 s collect on the first unit; it runs at 0.6 mm/s in three segments,
    as the stepped ramp did. Measured on 9DTact_hard_1mm_r2: collect 434 s at 50 %
    acceptance against 713 s at 30 % for the stepped ramp on 9DTact_medium_3mm_r2,
    a whole run 7.6 min against 12-15. Labels, bins, separation, budget and range
    are unchanged; the gel''s loading history is (no pauses at the rungs), which is
    why the eleven units before hard_1mm_r1 are marked as stepped'
  ramp_step_basis: 0.05 N gave 234 moves and about two minutes per loading cycle for
    roughly ten new frames once the separation rule had rejected the repeats. 0.1
    N halves the moves without changing what the ramp covers; the diversity comes
    from repeating the cycle, not from crawling through it
  force_backstop_N: 30.0
  limits_basis: '2026-09-04: both limits come from the force at which the sensor''s
    own image stops responding, measured by characterize. Depth and force backstops
    are set generously (10 mm, 25 N) because saturation has to be passed to be found
    -- a 5 N cap always bound first, so the saturation test never once set a ceiling.
    Measured saturation: 9.0 N on 9DTact soft 1 mm; not reached at 15.9 N on 9DTact
    hard 3 mm, where the image response was still 117 % of its low-force value and
    the local Hertz exponent 1.33-1.63 with no substrate stiffening'
  range_normal_N: 2.0
  range_basis: 'normal 2 N, shear 0.5 N (a quarter of it), set by the operator 2026-09-07;
    4/1 N earlier the same day, 5 N before that. Comparing sensors on force-estimation
    resolution requires the same span on each, and the span has to be one they can
    all actually reach: at 3 N only 10 of 18 units clear the depth backstop, at 2
    N 15 do, and the three that do not (soft 2 mm pair 1.83-1.89 N, hard_1mm_r1 2.02
    N) sit close enough that the Hertz extrapolation they are judged by may itself
    be under-reading. The range does NOT set the collection time: total ramp steps
    are budget x bin_width / (frames_per_cell x ramp_step), in which the range cancels
    -- measured 109/101/105/103 steps at 3.0/2.5/2.0/1.5 N. So it was chosen on data
    quality alone, and the narrower range puts 13 frames in each 0.05 N bin instead
    of 9. Friction does not cap the shear: mu >= 0.59 on the 1.2 N hold carries 0.71
    N against the 0.5 N asked. Measured on 9DTact_medium_2mm_r1 over 0-19 N, one model
    scored 9-10 % relative error over 0-2 N and 0.8-2.6 % over 14-17 N, so per-sensor
    ceilings would have made the MAEs incomparable; characterize still records each
    unit''s own limits and they only ever lower the range'
  range_shear_N: 0.5
  shear_hold_N: 1.2
  shear_hold_basis: 60 % of the 2 N normal range, recomputed 2026-09-07 when the range
    fell from 5 N. Nothing reads this key -- run_one_sensor derives the hold as 0.6
    x min(range_normal, safe_force_N) -- so it is here to be read by a person, and
    it was left saying 3.0 N through two changes of the range
  per_principle:
    DIGIT:
      diff_level_min: 12
      depth_frac: 0.7
      depth_offset_mm: 0.0
      basis: No black gel over the translucent layer, so thickness_mm is the whole
        compliant stack (operator, 2026-09-08). 0.7 rather than 0.9 is a deliberately
        tight start for a principle whose substrate behaviour has not been measured
        yet; raise it once the ladders show where the backing takes load. Gives 2.10
        / 1.40 / 0.70 mm for the 3 / 2 / 1 mm gels.
    DIGIT_Marker:
      diff_level_min: 12
      depth_frac: 0.7
      depth_offset_mm: 0.0
      basis: same gel construction as DIGIT; markers are printed on the surface
  depth_frac: 0.9
  depth_offset_mm: 1.0
  depth_limit_basis: '(thickness_mm + depth_offset_mm) x depth_frac from the gel surface,
    binding in every phase. Reinstated 2026-09-04 as thickness_mm x 0.9 after 9DTact_medium_2mm_r1
    was permanently deformed by probes reaching 5.5-6.6 mm on a 2 mm layer: its contact
    height fell 26.234 -> 26.074 -> 25.964 mm and did not recover, against 0.03 mm
    run-to-run repeatability. The 1 mm offset was added 2026-09-07 by the operator:
    thickness_mm names the TRANSLUCENT gel the units are sorted by, and a 9DTact has
    a black gel cast over it, so the compliant stack the probe presses into is about
    a millimetre thicker than the label. Without the offset a 1 mm unit was held to
    0.90 mm and about 1 N against a 3 N collection range. This supersedes both the
    "depth_limit removed 2026-09-04" entry and the "runaway guard only" note that
    stood beside it -- three generations of the policy were on file at once and only
    this one was ever executed'
  depth_limit_effect: 'reachable force at the limit, from each unit''s own Hertz fit
    (an extrapolation 1.6-2.6x past the fitted depth, so a floor rather than a prediction;
    the gel stiffens near its backing): 1 mm units 2.0-4.0 N, 2 mm 1.8-9.9 N, 3 mm
    2.4-11.3 N. Fifteen of eighteen reach the 2 N range outright and the soft 2 mm
    pair bind first at about 1.9 N, so a short range is recorded as short rather than
    bought with a damaged gel'
reference_sensor:
  id: 9DTact_hard_3mm_r1
  note: the unit characterised so far. 9DTact, HARDEST silicone, 3 mm. F = 1.628*depth^1.5
    over 0.25-5 N, free exponent 1.495 against Hertz's 1.5, surface repeatable to
    0.03 mm, mu > 0.58, no permanent set after two runs to 2.14 mm
  implication: this is the STIFFEST elastomer in the set and it still needs 2.14 mm
    to reach 5 N. Every softer one needs more depth for the same force, so the force
    ceiling is set by depth, not by the 5 N target, for most of the matrix
