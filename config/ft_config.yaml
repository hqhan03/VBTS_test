# ATI Mini45 + NI PCIe-6343 — experiment F/T sensor configuration
#
# This is the EXPERIMENT'S EXTERNAL F/T sensor, unrelated to the
# robot-integrated F/T fields in the FAIRINO real-time stream.
#
# Only values actually observed on this machine are filled in. Anything needing
# a look at the physical wiring is marked NEEDS PHYSICAL CONFIRMATION.

ft_sensor:
  manufacturer: ATI
  model: Mini45
  calibration_file: FT29831.cal
  serial_number: FT29831          # <FTSensor Serial="FT29831">
  part_number: SI-145-5           # 145 N / 5 N-m calibration
  interface: 9105-IFPS-1          # FTIFPS1 power supply / interface
  terminal_block: SCB-68A

daq:
  manufacturer: NI
  model: PCIe-6343
  device: Dev1
  serial_number_hex: "222BE10"

  # ---------------------------------------------------------------------
  # SG0..SG5 -> AI channel, IN GAUGE ORDER, matching the <UserAxis> column
  # order in FT29831.cal. Row i of a raw read is gauge SGi.
  #
  # CONFIRMED BY MEASUREMENT (Task 9, 2026-08-25), not by assumption:
  # with a 1.004 kg load, exactly six channels responded -- ai0..ai5, by
  # -4.4 to -117 mV. ai6, ai7 and every connector-1 channel sat at the -2 mV
  # floating floor. Under this mapping |Fz| came out -9.848 N against an
  # expected -9.846 N, an error of +0.02%.
  #
  # Terminal -> NI label -> channel (SCB-68A silkscreen, operator-read):
  #     ATI SG0  terminal 68 - 34  -> AI0 -> Dev1/ai0
  #     ATI SG1  terminal 65 - 66  -> AI2 -> Dev1/ai2
  #     ATI SG2  terminal 33 - 31  -> AI1 -> Dev1/ai1
  #     ATI SG3  terminal 30 - 63  -> AI3 -> Dev1/ai3
  #     ATI SG4  terminal 28 - 61  -> AI4 -> Dev1/ai4
  #     ATI SG5  terminal 60 - 26  -> AI5 -> Dev1/ai5
  # Note SG1 and SG2 cross over: terminal 65 is AI2 and terminal 33 is AI1.
  # ---------------------------------------------------------------------
  channels:
    - Dev1/ai0      # SG0   (terminal 68 - 34)
    - Dev1/ai2      # SG1   (terminal 65 - 66)
    - Dev1/ai1      # SG2   (terminal 33 - 31)
    - Dev1/ai3      # SG3   (terminal 30 - 63)
    - Dev1/ai4      # SG4   (terminal 28 - 61)
    - Dev1/ai7      # SG5   (AI7+ / AI15-)   relocated, see below

  # The SCB-68A is on the UPPER 68-pin connector. This matters: the two
  # connectors serve different AI groups (connector 0 = ai0-ai15, connector 1 =
  # ai16-ai31), so moving the block shifts every channel number by 16.
  connector: 0

  # The gauge -> channel MAPPING is confirmed: Task 9's load-response scan showed
  # exactly ai0..ai5 responding, and the 1 kg validation returned Fz within
  # +0.64% of m*g under this mapping.
  channel_mapping_confirmed: true

  # Every channel in the mapping above is driven and clean. The faults below
  # are about paths that are NOT used; none of them touches an active gauge.
  all_channels_healthy: true

  known_hardware_faults:
    - path: SCB-68A terminals 60 (+) / 26 (-)
      daq_channel: Dev1/ai5
      status: UNUSABLE — do not assign a gauge
      evidence: >-
        Continuity from IFPS pin 4/13 to the terminals is good and a meter reads
        the signal there (1.348 V unloaded, -8 mV under 1.004 kg), but it never
        reaches the DAQ. Dev1/ai5 reads as an open input: 99.98% of whatever the
        multiplexer sampled before it. The break is downstream of the screw
        terminal, inside the SCB-68A or the 68-pin cable.
    - path: SCB-68A AI6 pair (AI6+ / AI14-)
      daq_channel: Dev1/ai6
      status: DEGRADED — do not assign a gauge
      evidence: >-
        Carries a signal, but couples about 2.1% of the preceding channel into
        it, against 0.01-0.02% on every healthy input. Re-seating the terminal
        did not help, and slowing the convert clock from 12 us to 200 us per
        channel did not help, so it is neither a loose screw nor a settling
        limitation. Moving the same SG5 lead to the AI7 pair dropped the
        coupling to 0.01%, which proves the fault belongs to the AI6 terminal
        pair and not to the SG5 signal path. Mechanism not established.

  # ---------------------------------------------------------------------
  # SG5 RELOCATION HISTORY
  #
  # SG5 started on terminals 60/26 (Dev1/ai5) and was dead there. Because SG5's
  # Fz coefficient is small (+1.18 N/V) while its Fx coefficient is large
  # (+23.73 N/V), that fault left Fz looking nearly correct while injecting up
  # to -38 N of false Fx. Every "phantom lateral force" result up to Task 12
  # traces back to it.
  #
  # Same 1.004 kg load, three wirings:
  #   terminals 60/26 -> ai5   Fz -9.855 N (+0.10%)  lateral 3.026 N  xtalk 100%
  #   AI6 pair        -> ai6   Fz -9.809 N (-0.38%)  lateral 0.244 N  xtalk 2.1%
  #   AI7 pair        -> ai7   Fz -9.696 N (-1.52%)  lateral 0.158 N  xtalk 0.01%
  #
  # AI7 is the final choice: lowest lateral and crosstalk at a healthy-channel
  # level. Its Fz error is numerically larger than AI6's, but that difference
  # tracks where the mass was set down (implied eccentricity -5.4 mm here
  # versus -3.9 mm on the AI6 run) rather than wiring quality, and all three
  # sit well inside the 5% tolerance.
  # ---------------------------------------------------------------------

  # From the calibration file's OutputMode="Ground Referenced Differential",
  # and consistent with the sweep (return legs sat at ground).
  terminal_configuration: differential

  # +/-10 V. The cal file declares OutputRange="20" with OutputBipolar="True",
  # a 20 V bipolar span, so this cannot clip a loaded sensor. 16-bit over
  # +/-10 V is 305 uV/LSB, below the measured 620-880 uV per-channel noise, so
  # the headroom costs no real resolution.
  voltage_range: 10.0

  # 2 kHz/channel. 6 ch x 2 kHz = 12 kS/s, 2.4% of the 6343's 500 kS/s
  # aggregate, so nowhere near an overrun. Quasi-static indentation is well
  # under 10 Hz, leaving ~100x oversampling to decimate against noise, and
  # 2 kHz divides evenly by 30/60 Hz camera rates for later synchronisation.
  # Deliberately not the hardware maximum.
  sampling_rate_hz: 2000.0
  samples_per_read: 200           # 10 blocks/s, 100 ms latency
  buffer_size: 2000               # 1 s of buffering

  # Samples discarded immediately after the task starts. The first samples are
  # an input-settling transient: measured here, ai1 begins near -8.4 V and
  # RC-decays to its steady value over ~34 samples. 200 (100 ms) is a
  # comfortable margin and keeps the transient out of tare and baseline.
  settle_samples: 200

# ---------------------------------------------------------------------------
# SCB-68A terminal wiring — OPERATOR CONFIRMED GROUND TRUTH (2026-08-25).
# Read off the physical terminal block. This records WHICH SCREW TERMINAL each
# ATI strain-gauge lead lands on. It does NOT by itself say which Dev1/aiN that
# is: NI-DAQmx exposes no pin numbers, so the terminal -> channel step needs the
# 68-pin connector pinout and is still UNRESOLVED. See
# scripts/diagnose_daq_terminal_mapping.py.
# ---------------------------------------------------------------------------
scb68a_wiring:
  terminal_block: SCB-68A
  connector: 0
  confirmed_by: operator silkscreen read + meter measurement + DAQ delta scan
  confirmed_date: "2026-08-25"

  # !! SG0 REFERENCE IS TERMINAL 34, NOT 35 !!
  # Terminal 34 is AI0-, the differential partner of AI0+ on terminal 68.
  # Terminal 35 is AI GND. An earlier attempt used 35, which left the AI0
  # differential negative floating; the DAQ then read pin 68 against nothing and
  # Dev1/ai0 behaved as an open circuit (it tracked whatever channel the
  # multiplexer sampled before it). That single wiring error is what produced
  # every "ai0 open", "SG0 missing" and "+18% / -23% scale" symptom seen in
  # Tasks 5-8. Do not use terminal 35 for SG0.
  gauges:
    SG0: {positive_terminal: 68, negative_terminal: 34}   # NOT 35
    SG1: {positive_terminal: 65, negative_terminal: 66}
    SG2: {positive_terminal: 33, negative_terminal: 31}
    SG3: {positive_terminal: 30, negative_terminal: 63}
    SG4: {positive_terminal: 28, negative_terminal: 61}
    SG5: {positive_terminal: 60, negative_terminal: 26}

calibration:
  identifier: FT29831
  cal_date: "1/8/2020"
  native_force_unit: N            # <Calibration ForceUnits="N">
  native_torque_unit: N-m         # <Calibration TorqueUnits="N-m">
  # Use <UserAxis>, per the file's own instruction. It already includes
  # <BasicTransform> (Dz = 0.006858 m), verified numerically to <1e-5, so the
  # transform must not be applied a second time.
  matrix_source: UserAxis
  basic_transform_already_applied: true

validation:
  # scripts/test_weight_validation.py
  test_mass_kg: 1.004      # measured mass, 1004 g
  # CODATA/ISO standard gravity. Local g differs by up to ~0.3%, which is well
  # inside the tolerance below, so it is not worth measuring for a sanity check.
  gravity_m_s2: 9.80665
  # Accept +/-5% on |Fz|. This is a wiring/sign/scale sanity check, not a
  # metrological calibration: it must catch an off-by-one channel map (which
  # would be wrong by tens of percent or more), not certify accuracy.
  tolerance_fraction: 0.05

output:
  force_unit: N
  torque_unit: N_m
  # Sensor frame only. No holder or robot base transform is applied anywhere
  # in this codebase yet.
  frame: ATI_sensor_frame
